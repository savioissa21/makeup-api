# --- CONEXÃO COM O DOCKER (POSTGRES) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/makeup_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Diz ao Hibernate que estamos usando Postgres Real
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURAÇÕES DE TESTE ---
# Permite sobrescrever Beans (resolve aquele erro antigo)
spring.main.allow-bean-definition-overriding=true

# Desativa o Redis nos testes (para não depender dele se não quiser)
spring.cache.type=none

# Garante que o Flyway rode as migrações no banco de teste
spring.flyway.enabled=true

# ==============================================================
# CONFIGURAÇÕES DE SEGURANÇA JWT
# ==============================================================

# Uma chave secreta forte (256-bit) para assinar os tokens
# Esta é uma chave de exemplo gerada aleatoriamente em Hex
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Tempo de expiração do token de acesso (ex: 1 dia em milissegundos)
application.security.jwt.expiration=86400000

# Tempo de expiração do refresh token (ex: 7 dias em milissegundos)
application.security.jwt.refresh-token.expiration=604800000


# ==============================================================
# CONFIGURAÇÕES DE EMAIL (JavaMailSender)
# ==============================================================

# Configuração dummy para o Spring criar o Bean e a aplicação subir.
# Quando for para produção, você troca pelos dados reais (ex: Gmail, AWS SES, SendGrid)
spring.mail.host=smtp.exemplo.com
spring.mail.port=587
spring.mail.username=seu-email@exemplo.com
spring.mail.password=sua-senha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

